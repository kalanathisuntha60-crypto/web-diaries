<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Diaries</title>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #f4f6f8;
      --text: #222;
      --card: #ffffff;
      --primary: #4f46e5;
    }

    body.dark {
      --bg: #0f172a;
      --text: #e5e7eb;
      --card: #1e293b;
    }

    * {
      box-sizing: border-box;
      transition: 0.3s;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    header {
      padding: 70px 20px;
      text-align: center;
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: white;
    }

    header h1 {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    nav {
      background: var(--card);
      padding: 15px;
      text-align: center;
      position: sticky;
      top: 0;
      box-shadow: 0 5px 15px rgba(0,0,0,0.05);
      z-index: 100;
    }

    nav a {
      margin: 0 15px;
      text-decoration: none;
      color: var(--text);
      font-weight: 500;
    }

    nav a:hover {
      color: var(--primary);
    }

    .toggle {
      float: right;
      margin-right: 20px;
      cursor: pointer;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 40px 20px;
    }

    article {
      background: var(--card);
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      margin-bottom: 40px;
    }

    article h2 {
      color: var(--primary);
      margin-bottom: 5px;
    }

    .date {
      font-size: 13px;
      opacity: 0.7;
      margin-bottom: 15px;
    }

    button {
      padding: 10px 18px;
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 30px;
      cursor: pointer;
      margin-top: 10px;
    }

    .comments {
      margin-top: 25px;
    }

    input, textarea {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 8px;
      border: 1px solid #ccc;
      font-family: inherit;
    }

    .comment {
      background: rgba(0,0,0,0.05);
      padding: 10px;
      border-radius: 8px;
      margin-top: 10px;
    }

    footer {
      text-align: center;
      padding: 30px;
      opacity: 0.8;
    }
  </style>
</head>

<body>

<header>
  <h1>Web Diaries</h1>
  <p>Thoughts, stories & growth on the web</p>
</header>

<nav>
  <a href="#">Home</a>
  <a href="#">Posts</a>
  <a href="#">About</a>
  <span class="toggle" onclick="toggleDark()">🌙</span>
</nav>

<main>

  <article>
    <h2>Welcome to Web Diaries</h2>
    <p class="date">January 2026</p>
    <p>
      Web Diaries is my personal blog where I share thoughts, stories,
      and learning experiences about web development and technology.
    </p>

    <button onclick="like(this)">❤️ Like <span>0</span></button>

    <div class="comments">
      <h3>Comments</h3>
      <input id="name" placeholder="Your name">
      <textarea id="message" placeholder="Write a comment..."></textarea>
      <button onclick="addComment()">Post Comment</button>
      <div id="commentList"></div>
    </div>
  </article>

</main>

<footer>
  © 2026 Web Diaries · Built
