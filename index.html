<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Diaries</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-5ZVY8M8V80"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-5ZVY8M8V80');
  </script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(
          rgba(0,0,0,0.65),
          rgba(0,0,0,0.65)
        ),
        url("https://images.unsplash.com/photo-1518770660439-4636190af475");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
    }

    .hero {
      text-align: center;
      animation: fadeUp 1.5s ease forwards;
      max-width: 700px;
      padding: 20px;
    }

    .hero h1 {
      font-size: 3rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 1.1rem;
      line-height: 1.8;
      opacity: 0.9;
      margin-bottom: 30px;
    }

    .hero a {
      display: inline-block;
      padding: 12px 28px;
      background: #00e5ff;
      color: #000;
      text-decoration: none;
      border-radius: 30px;
      font-weight: 500;
      transition: transform 0.3s, box-shadow 0.3s;
    }

    .hero a:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 30px rgba(0,229,255,0.4);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div class="hero">
    <h1>Web Diaries</h1>
    <p>
      A personal space where I share my journey, thoughts, and learning
      experiences in web development, technology, and life on the internet.
    </p>
    <a href="#">Explore Blog</a>
  </div>
</body>
</html>
